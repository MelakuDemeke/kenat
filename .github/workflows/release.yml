name: Release

# Fires when `npm run release:patch|minor|major` pushes a version tag
# (created by `npm version`, e.g. v3.2.1). Publishing only ever happens
# here, never from a local machine - see CONTRIBUTING/README for the
# release flow.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing and provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Authenticates via npm trusted publishing (GitHub OIDC, id-token: write
      # above), so no NPM_TOKEN and no 2FA one-time password are needed.
      # Configure it on npmjs.com: package kenat -> Settings -> Trusted
      # publishing -> GitHub Actions, repo MelakuDemeke/kenat, workflow release.yml.
      - name: Publish to npm
        run: npm publish --provenance
